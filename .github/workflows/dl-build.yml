name: Build DailyStack APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'DailyStack.zip'                 # run when the packaged zip is updated
      - 'app/**'                         # run when app sources change
      - 'gradle/**'                      # run when gradle scripts change
      - 'settings.gradle'
      - 'settings.gradle.kts'
      - '.github/workflows/dl-build.yml' # run when this workflow file changes

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unpack DailyStack.zip and locate Android project
        run: |
          if [ -f "DailyStack.zip" ]; then
            echo "Found DailyStack.zip"
            unzip -o DailyStack.zip -d .
          else
            echo "::error::DailyStack.zip not found in repo root"
            exit 1
          fi

          # Find the Gradle project (settings file), searching a few levels deep.
          mapfile -t FOUND < <(find . -maxdepth 6 -name .git -prune -o \( -name settings.gradle.kts -o -name settings.gradle \) -print)
          if [ ${#FOUND[@]} -eq 0 ]; then
            echo "::error::No settings.gradle(.kts) found. Repo layout is:"
            find . -maxdepth 3 -not -path './.git/*' | head -60
            exit 1
          fi

          # Prefer the DailyStack project if several Gradle projects exist.
          PICK="${FOUND[0]}"
          for f in "${FOUND[@]}"; do
            if grep -q "DailyStack" "$f"; then PICK="$f"; break; fi
          done
          echo "Android project at: $(dirname \"$PICK\")"
          echo "PROJECT_DIR=$(dirname \"$PICK\")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: DailyStack-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
