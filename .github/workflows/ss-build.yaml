name: Sms Sentinel APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o SmsSentinel.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: gradle assembleDebug --no-daemon
        working-directory: SmsSentinel
      - uses: actions/upload-artifact@v4
        with:
          name: SmsSentinel-apk
          path: SmsSentinel/app/build/outputs/apk/debug/app-debug.apk
