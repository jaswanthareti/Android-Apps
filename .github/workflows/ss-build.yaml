name: Sms Sentinel APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'SmsSentinel.zip'                     # run when the packaged zip is updated
      - 'SmsSentinel/**'                      # run when the extracted project files change
      - '.github/workflows/ss-build.yaml'     # run when this workflow file changes
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o SmsSentinel.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: gradle assembleDebug --no-daemon
        working-directory: SmsSentinel
      - name: Name the APK
        working-directory: SmsSentinel
        run: cp app/build/outputs/apk/debug/app-debug.apk Guardly.apk
      - name: Print signing key (must be identical on every build, or Android refuses the update)
        working-directory: SmsSentinel
        continue-on-error: true
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs Guardly.apk | grep -E "SHA-256|Signer #1 certificate DN" || true
      - uses: actions/upload-artifact@v4
        with:
          name: Guardly-apk
          path: SmsSentinel/Guardly.apk
