name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unzip project if present
        run: |
          if [ -f "project.zip" ]; then
            echo "Found project.zip"
            unzip -o project.zip -d .
          elif [ -f "SmsSentinel.zip" ]; then
            echo "Found SmsSentinel.zip"
            unzip -o SmsSentinel.zip -d .
          else
            echo "::error::No zip file found in repo root"
            exit 1
          fi

      - name: Locate Android project
        run: |
          echo "Searching for gradlew..."
          find . -name gradlew -type f | head
          GRADLEW_PATH=$(find . -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::No gradlew found in extracted project"
            exit 1
          fi
          echo "GRADLEW_PATH=$GRADLEW_PATH"
          echo "$GRADLEW_PATH" > /tmp/gradlew_path.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build APK
        run: |
          GRADLEW_PATH=$(cat /tmp/gradlew_path.txt)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          chmod +x "$GRADLEW_PATH"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SmsSentinel-apk
          path: |
            **/app/build/outputs/apk/debug/app-debug.apk
