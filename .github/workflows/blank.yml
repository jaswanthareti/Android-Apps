name: Build debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project if delivered as project.zip
        run: |
          if [ -f "project.zip" ]; then
            echo "Found project.zip at repo root, extracting..."
            unzip -o project.zip -d .
            rm -f project.zip
          else
            echo "No project.zip found; assuming the project was uploaded as loose files."
          fi

      - name: Verify gradlew is present
        run: |
          if [ ! -f "gradlew" ]; then
            echo "::error::gradlew not found at repo root after setup. Check that project.zip extracts files directly to the repo root (not into a nested subfolder), or that you uploaded the project's files directly to the repo root."
            exit 1
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12.0"

      - name: Accept Android SDK licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          elif [ -x "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" --licenses
          else
            echo "::warning::sdkmanager not found at expected path"
            exit 1
          fi

      - name: Install Android SDK components
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
              "platform-tools" \
              "platforms;android-34" \
              "build-tools;34.0.0"
          else
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" --install \
              "platform-tools" \
              "platforms;android-34" \
              "build-tools;34.0.0"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Run assembleDebug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
