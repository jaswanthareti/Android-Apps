name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip project
        run: unzip -o SmsSentinel.zip
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      
      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: SmsSentinel
      
      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: SmsSentinel
      
      - uses: actions/upload-artifact@v4
        with:
          name: SmsSentinel-apk
          path: SmsSentinel/app/build/outputs/apk/debug/app-debug.apk
